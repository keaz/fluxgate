# FluxGate demo stack for the video series.
#
#   docker compose -f docker-compose.demo.yml up -d
#
# Download this file and config.demo.toml into one folder and run the command
# from that folder. It starts postgres, backend and ui (images keaz/flux-gate-*
# at v1.2.0 from Docker Hub). The edge server sits behind the `edge`
# profile because it needs the id and API key of an existing client (created
# in the UI). Start it later with:
#
#   docker compose -f docker-compose.demo.yml --profile edge up -d
#
# Variables read by this file. Put them in a `.env` file next to this file;
# docker compose reads `.env` from the project folder automatically.
#   FLUXGATE_ENCRYPTION_KEY  required; base64 of 32 bytes (openssl rand -base64 32)
#   TYPESAFE_API_KEY         optional; enables the AI features (video 14)
#   EDGE_CLIENT_ID           edge profile only; client id (UUID) from the Clients page
#   EDGE_CLIENT_SECRET       edge profile only; that client's API key
#                            Both default to empty so that `up -d` works without them;
#                            the edge cannot reach the backend until they are set.
services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=local123
      - POSTGRES_DB=feature_toggle
    ports:
      - "5433:5432"
    volumes:
      # Named volume: data survives `down` and `up`; `down -v` deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feature_toggle"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: keaz/flux-gate-backend:v1.2.0
    environment:
      - DATABASE_URL=postgres://postgres:local123@postgres:5432/feature_toggle
      - FLUXGATE_ENCRYPTION_KEY=${FLUXGATE_ENCRYPTION_KEY:?set FLUXGATE_ENCRYPTION_KEY (openssl rand -base64 32)}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - RUST_LOG=info
    ports:
      - "8080:8080" # REST and Swagger UI at /docs
    volumes:
      # The entrypoint copies /app/config/config.toml to /app/config.toml.
      - ./config.demo.toml:/app/config/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: keaz/flux-gate-ui:v1.2.0
    environment:
      # The UI has no proxy: the browser calls the backend directly at
      # ${BACKEND_PROTOCOL}://${BACKEND_HOST}:${BACKEND_PORT}/api/v1, so this is
      # the host name your browser uses, not the compose service name.
      - BACKEND_HOST=localhost
      - BACKEND_PORT=8080
      - BACKEND_PROTOCOL=http
      - WS_PROTOCOL=ws
    ports:
      - "3000:80"
    depends_on:
      - backend

  edge:
    profiles: ["edge"]
    image: keaz/flux-gate-edge:v1.2.0
    environment:
      - EDGE_BACKEND_GRPC=http://backend:50051
      - EDGE_HTTP_ADDR=0.0.0.0:8081
      - EDGE_CLIENT_ID=${EDGE_CLIENT_ID:-}
      - EDGE_CLIENT_SECRET=${EDGE_CLIENT_SECRET:-}
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  pgdata: {}
