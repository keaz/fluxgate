# FluxGate Performance Test - XLarge Profile
# Edge limits: 8 CPU, 2048 MiB (reservations: 4 CPU, 1024 MiB)
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.xlarge.yml up

services:
  edge:
    deploy:
      resources:
        limits:
          cpus: '8.0'       # 8000m equivalent
          memory: 2048M
        reservations:
          cpus: '4.0'       # 4000m equivalent
          memory: 1024M
    labels:
      - "fluxgate.profile=xlarge"
      - "fluxgate.cpu=4000m-8000m"
      - "fluxgate.memory=1024Mi-2048Mi"
