# PostgreSQL Configuration for FluxGate Performance Tests
# Optimized for READ-HEAVY workloads with maximum caching
#
# This configuration prioritizes:
# - Maximum memory caching
# - Fast read performance
# - SSD-optimized settings
# - Reduced write overhead for test environments

# =============================================================================
# MEMORY SETTINGS - Aggressive Caching
# =============================================================================

# Shared Buffers: Main PostgreSQL cache
# Set to 25-40% of available RAM for optimal caching
# For containers with 512MB-1GB RAM: 256MB
# For containers with 1-2GB RAM: 512MB
shared_buffers = 256MB

# Effective Cache Size: Total memory available for disk caching
# Tells query planner how much memory OS has for caching
# Set to 50-75% of total RAM
# This helps PostgreSQL keep more data in memory
effective_cache_size = 512MB

# Work Memory: Memory for sorts and joins per operation
# Higher values speed up complex queries
# 16MB is good for read-heavy workloads
work_mem = 16MB

# Maintenance Work Memory: For VACUUM, CREATE INDEX, etc.
# Higher value speeds up maintenance operations
maintenance_work_mem = 64MB

# =============================================================================
# QUERY PLANNER - Optimize for Fast Reads
# =============================================================================

# Random Page Cost: Cost of non-sequential page fetch
# Lower for SSD (default is 4.0, SSD should be 1.0-1.5)
# This makes index scans more attractive
random_page_cost = 1.1

# Sequential Page Cost: Cost of sequential page fetch
# Keep at 1.0 (baseline)
seq_page_cost = 1.0

# CPU Tuple Cost: Cost of processing each row
# Lower means row processing is cheaper
cpu_tuple_cost = 0.01

# CPU Index Tuple Cost: Cost of processing each index entry
# Lower for fast index scans
cpu_index_tuple_cost = 0.005

# CPU Operator Cost: Cost of each operator or function
cpu_operator_cost = 0.0025

# Effective I/O Concurrency: Number of concurrent I/O operations
# Higher for SSD (1-300), helps parallel queries
# Set to 200 for modern SSDs
effective_io_concurrency = 200

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Listen on all network interfaces (required for Docker networking)
# Default is 'localhost' which only allows local connections
listen_addresses = '*'

# Maximum connections
# Keep moderate for performance testing
max_connections = 100

# =============================================================================
# WRITE-AHEAD LOG (WAL) - Reduce Write Overhead
# =============================================================================

# WAL Buffers: Memory for WAL before writing to disk
# -1 = auto (typically 1/32 of shared_buffers)
wal_buffers = 8MB

# Checkpoint Timeout: Time between automatic checkpoints
# Longer = fewer checkpoints = less I/O overhead
# 15min is good for performance testing
checkpoint_timeout = 15min

# Checkpoint Completion Target: Spread checkpoint I/O
# 0.9 = spread writes over 90% of checkpoint interval
checkpoint_completion_target = 0.9

# Max WAL Size: Maximum size of WAL between checkpoints
# Larger = fewer checkpoints but more recovery time
max_wal_size = 2GB
min_wal_size = 512MB

# WAL Writer Delay: How often WAL writer flushes
# Higher = less frequent flushes = better write performance
wal_writer_delay = 200ms

# Commit Delay: Batch commits for better performance
# Only effective under high concurrent load
commit_delay = 10
commit_siblings = 5

# =============================================================================
# PERFORMANCE TESTING ONLY - UNSAFE FOR PRODUCTION
# =============================================================================

# Fsync: Force synchronous writes to disk
# OFF = MUCH faster but DATA LOSS on crash
# WARNING: ONLY use for performance testing, NEVER in production
# Uncomment the line below ONLY for max performance testing
# fsync = off

# Synchronous Commit: Wait for WAL to be written
# OFF = faster commits but risk of recent transaction loss on crash
# Good for performance testing where data loss is acceptable
synchronous_commit = off

# Full Page Writes: Write full pages to WAL after checkpoint
# OFF = faster but risk of corruption on crash
# Can disable for performance testing
full_page_writes = off

# =============================================================================
# AUTOVACUUM - Keep Statistics Updated
# =============================================================================

# Autovacuum: Automatic cleanup of dead rows
# Keep enabled for accurate statistics
autovacuum = on

# Autovacuum max workers
autovacuum_max_workers = 3

# Vacuum cost delay: 0 = no delay (faster vacuuming)
autovacuum_vacuum_cost_delay = 20ms

# Autovacuum analyze threshold: Update stats more frequently
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# STATISTICS - Help Query Planner
# =============================================================================

# Default Statistics Target: How many samples to collect
# Higher = more accurate query plans
# 100 is good for read-heavy workloads
default_statistics_target = 100

# Track activities and counts
track_activities = on
track_counts = on
track_io_timing = on

# =============================================================================
# LOGGING - Minimal for Performance
# =============================================================================

# Log only errors and critical issues
log_min_messages = warning
log_min_error_statement = error

# Don't log every query (too much overhead)
log_statement = 'none'

# Log slow queries (helps identify bottlenecks)
log_min_duration_statement = 1000  # Log queries > 1 second

# Log connections and disconnections
log_connections = off
log_disconnections = off

# =============================================================================
# LOCALE AND FORMATTING
# =============================================================================

# Use C locale for better performance (less collation overhead)
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Timezone
timezone = 'UTC'

# =============================================================================
# ADDITIONAL OPTIMIZATIONS
# =============================================================================

# Huge Pages: Use huge pages if available (requires OS config)
huge_pages = try

# Dynamic shared memory
dynamic_shared_memory_type = posix

# Max parallel workers per gather
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# Enable JIT compilation for faster query execution (PG 11+)
jit = on

# =============================================================================
# NOTES
# =============================================================================
#
# Key Performance Settings Summary:
# - shared_buffers: 256MB (main cache)
# - effective_cache_size: 512MB (tells planner about OS cache)
# - work_mem: 16MB (per-operation memory)
# - random_page_cost: 1.1 (SSD optimized)
# - effective_io_concurrency: 200 (SSD optimized)
# - synchronous_commit: off (faster, test-only)
# - full_page_writes: off (faster, test-only)
#
# For even MORE performance (USE WITH CAUTION):
# Uncomment: fsync = off
# This disables all disk synchronization = MAXIMUM speed
# But: ALL data will be lost on crash!
# Only use for disposable performance test environments
#
# Memory Usage Estimate:
# - shared_buffers: 256MB
# - work_mem * max_connections: 16MB * 100 = 1.6GB (worst case)
# - maintenance_work_mem: 64MB
# - OS cache (effective_cache_size): 512MB
# Total recommended RAM: 2GB minimum, 4GB recommended
