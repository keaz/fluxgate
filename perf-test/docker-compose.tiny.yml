# FluxGate Performance Test - Tiny Profile (Baseline)
# Edge limits: 0.5 CPU, 128 MiB (reservations: 0.25 CPU, 64 MiB)
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.tiny.yml up

services:
  edge:
    deploy:
      resources:
        limits:
          cpus: '0.5'       # 500m equivalent
          memory: 128M
        reservations:
          cpus: '0.25'      # 250m equivalent
          memory: 64M
    labels:
      - "fluxgate.profile=tiny"
      - "fluxgate.cpu=250m-500m"
      - "fluxgate.memory=64Mi-128Mi"
